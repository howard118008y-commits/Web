name: 同步 sitemap lastmod

# 依實際頁面更新時間維護 sitemap lastmod，供搜尋引擎發現更新。
# 一般文章使用 sitemap 與 Search Console；Google Indexing API
# 僅限官方支援的職缺／特定直播頁，不能當成一般頁面的收錄工具。
# 這支工作流程僅維護 sitemap，不提交 Google Indexing API。

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lastmod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 必要：淺 clone 會讓 git log -1 <file> 全部回同一個 commit 日期

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依各檔最後 commit 日期改寫 lastmod
        run: python3 scripts/update_sitemap_lastmod.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --staged --quiet; then
            echo "✓ lastmod 無變更"
            exit 0
          fi
          git commit -m "chore(sitemap): 同步 lastmod $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "✓ Push 成功（第 $attempt 次）"
              exit 0
            fi
            echo "⚠ Push 第 $attempt 次失敗，10 秒後重試"
            sleep 10
          done
          echo "✗ Push 重試 3 次仍失敗"
          exit 1
