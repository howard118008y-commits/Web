name: LVR Observatory Update

on:
  schedule:
    # 內政部每月 1/11/21 公告 mini-package；本站每月 2/12/22 抓
    # 09:00 Taipei time = 01:00 UTC
    - cron: '0 1 2,12,22 * *'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chinese fonts (matplotlib 中文顯示)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv > /dev/null
          # 清掉 matplotlib 字型 cache 強迫重掃
          rm -rf ~/.cache/matplotlib

      - name: Cache LVR season zips
        id: lvr-cache
        uses: actions/cache@v4
        with:
          path: scripts/lvr/_cache
          # key 帶 run_id：actions/cache 命中舊 key 時不會回存，固定 key 曾把當季 zip
          # 永遠凍結在第一次下載（2026-01 之後月份全空的事故根因）。
          # 現在每次 run 結束都存新 cache，restore-keys 撿最近一份；
          # 增補期季檔的重抓由 download_lvr.py 的 FRESH_DAYS 視窗負責。
          key: lvr-zip-cache-v2-${{ github.run_id }}
          restore-keys: |
            lvr-zip-cache-v2-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/lvr/requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Download LVR data (skips existing in cache)
        working-directory: scripts/lvr
        run: python download_lvr.py

      - name: Analyze 買賣 + clean
        working-directory: scripts/lvr
        run: python analyze_lvr.py

      - name: Analyze 預售 + 租屋
        working-directory: scripts/lvr
        run: python analyze_extras.py

      - name: Generate charts (買賣)
        working-directory: scripts/lvr
        run: python make_charts.py

      - name: Generate social media cards (1080×1350)
        working-directory: scripts/lvr
        run: python make_social_cards.py

      - name: Generate AI weekly report (Claude API)
        working-directory: scripts/lvr
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_ai_report.py

      - name: Build observatory HTML
        working-directory: scripts/lvr
        run: python build_observatory.py

      - name: Build 預售 + 租屋 HTML
        working-directory: scripts/lvr
        run: python build_extras.py

      - name: Sync tools.html Data Hub stats (行政區/筆數/縣市)
        working-directory: scripts/lvr
        run: python sync_hub_stats.py

      - name: Commit + push (if changed)
        run: |
          git config user.name "LVR Observatory Bot"
          git config user.email "lvr-bot@users.noreply.github.com"
          git add lvr-observatory.html lvr-presale.html lvr-rental.html lvr-charts/ lvr-data/ lvr-social-cards/ tools.html
          if git diff --staged --quiet; then
            echo "✓ No content changes — skipping commit."
            exit 0
          fi
          git commit -m "chore(lvr): weekly observatory update $(date -u +%Y-%m-%d)"
          # Retry push with rebase to avoid race with other CRON workflows
          for attempt in 1 2 3 4 5; do
            echo "→ Push attempt $attempt"
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "✓ Push successful on attempt $attempt"
              exit 0
            fi
            echo "  ⚠ Push attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "✗ Push failed after 5 attempts"
          exit 1

      - name: Check YoY ±20% alerts (LINE push)
        # 即使 commit step 沒變動，alerts 仍每次跑（穩定情況也 print log）
        working-directory: scripts/lvr
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python check_alerts.py
