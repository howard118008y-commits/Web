name: 每日更新 18 項指標數據

on:
  schedule:
    - cron: '30 0 * * *'   # 每天 08:30 台灣時間（UTC+8）
  workflow_dispatch:         # 允許手動觸發

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yfinance beautifulsoup4 lxml xlrd openpyxl pypdf

      - name: Fetch indicator data
        run: python scripts/fetch_indicators.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cx_data.json
          if git diff --staged --quiet; then
            echo "✓ 無變更，跳過 commit"
            exit 0
          fi
          git commit -m "data: auto-update indicators $(date -u +'%Y-%m-%d %H:%M UTC')"
          # rebase 重試：避免與本機排程器/其他 bot 撞車（2026-07-05 曾因此掉更新）
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "✓ Push 成功（第 $attempt 次）"
              exit 0
            fi
            echo "⚠ Push 第 $attempt 次失敗，10 秒後重試"
            sleep 10
          done
          echo "✗ Push 重試 5 次仍失敗"
          exit 1
