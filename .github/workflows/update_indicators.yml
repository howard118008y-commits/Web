name: 每日更新 18 項指標數據

on:
  schedule:
    - cron: '30 0 * * *'   # 每天 08:30 台灣時間（UTC+8）
  workflow_dispatch:         # 允許手動觸發

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yfinance beautifulsoup4 lxml

      - name: Fetch indicator data
        run: python scripts/fetch_indicators.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cx_data.json
          git diff --staged --quiet \
            || git commit -m "data: auto-update indicators $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
