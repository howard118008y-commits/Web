name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  html-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: HTML 標籤平衡 + 內部連結檢查
        run: python3 scripts/ci_check.py
