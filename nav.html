<meta name="robots" content="noindex">
<style>
/* === 手機版漢堡選單 === */
/* 線條幾何改自 Uiverse Cevorob / good-wolverine-51（MIT）：左錨點收合成 X、中線橫向縮沒。
   觸發沿用既有 aria-expanded（不改 JS）；外框維持 44px 觸控目標（WCAG 2.5.8），
   線條區另用 .cx-burger-box 定位，避免 X 的頂點跑到 44px 框的角落。 */
.cx-burger{display:none;background:none;border:0;width:44px;height:44px;flex-shrink:0;padding:0;cursor:pointer;position:relative;align-items:center;justify-content:center;font-family:inherit}
.cx-burger-box{position:relative;display:block;width:24px;height:16px}
.cx-burger-box span{display:block;position:absolute;left:0;width:100%;height:2.5px;background:#1d1d1f;border-radius:9px;opacity:1;transform:rotate(0deg);transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .2s ease,width .28s cubic-bezier(.4,0,.2,1),background .28s ease}
/* 收合成 X 時轉品牌紅：狀態變化＝品牌色，與 nav logo 的「鋮」同一組紅 */
.cx-burger[aria-expanded="true"] .cx-burger-box span{background:var(--red,#C61B1C)}
.cx-burger-box span:nth-child(1){top:0;transform-origin:left center}
.cx-burger-box span:nth-child(2){top:50%;transform:translateY(-50%);transform-origin:left center}
.cx-burger-box span:nth-child(3){top:100%;transform:translateY(-100%);transform-origin:left center}
.cx-burger[aria-expanded="true"] .cx-burger-box span:nth-child(1){transform:rotate(45deg);top:-1px;left:3px}
.cx-burger[aria-expanded="true"] .cx-burger-box span:nth-child(2){width:0;opacity:0}
.cx-burger[aria-expanded="true"] .cx-burger-box span:nth-child(3){transform:rotate(-45deg);top:15px;left:3px}

.cx-mobile-menu{display:none;position:fixed;inset:var(--cx-nav-h,48px) 0 0 0;background:#fff;z-index:99;padding:24px 24px 40px;flex-direction:column;gap:0;overflow-y:auto;animation:cxMenuSlide .25s ease}
.cx-mobile-menu.cx-open{display:flex}
@keyframes cxMenuSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.cx-mobile-menu a{font-size:18px;font-weight:600;color:#1d1d1f;padding:18px 4px;border-bottom:.5px solid #e8e8ed;text-decoration:none;display:flex;justify-content:space-between;align-items:center}
.cx-mobile-menu a::after{content:"›";color:#c7c7cc;font-size:22px;font-weight:300}
.cx-mobile-menu a.cx-mobile-cta{margin-top:18px;background:#048456;color:#fff;border:0;border-radius:12px;padding:18px 22px;justify-content:center;font-size:17px;font-weight:700}
.cx-mobile-menu a.cx-mobile-cta::after{content:""}
.cx-mobile-menu a.cx-mobile-radar{margin-top:10px;background:#141414;color:#fff;border:0;border-radius:12px;padding:18px 22px;justify-content:center;font-size:17px;font-weight:700}
.cx-mobile-menu a.cx-mobile-radar::after{content:""}
.cx-mobile-menu a.active{color:var(--red,#C61B1C)}
body.cx-menu-open{position:fixed;left:0;right:0;width:100%;overflow:hidden;overscroll-behavior:none}
body.cx-menu-open .cx-social-dock{display:none}

/* 房貸儀表板按鈕 — 精品輪廓款（去漸層藍，對齊全站精品系統） */
.nav-radar-btn{
  font-size:12px;font-weight:600;
  background:transparent;
  color:#141414;padding:5px 14px;border-radius:20px;
  border:1px solid #141414;
  white-space:nowrap;letter-spacing:.06em;
  text-decoration:none;
  transition:background .2s,color .2s;
}
.nav-radar-btn:hover{background:#141414;color:#fff}


.nav-center{display:flex;align-items:center;gap:24px}

/* 手機版導覽列常駐轉換入口（藥丸） */
/* 觸控目標 ≥44px（WCAG 2.5.8）。直接把藥丸拉到 44px 會塞滿 48px 導覽列、視覺走樣，
   故維持藥丸原尺寸，改用 ::after 透明覆蓋層把「可點範圍」撐到 44px（視覺零變動）。 */
.nav-apply-pill{display:none;background:var(--red,#C61B1C);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:18px;text-decoration:none;white-space:nowrap;letter-spacing:.02em;position:relative}
.nav-apply-pill::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:44px}

@media(max-width:768px){
  .cx-burger{display:flex}
  nav .nav-center,nav .nav-radar-btn{display:none!important}
  nav .nav-logo span{font-size:14px}
  .nav-apply-pill{display:inline-flex;align-items:center;margin-right:6px;margin-left:auto}
  nav{display:flex;align-items:center}
}

/* 沒載 style.css 的頁（article 系列等 26 頁）nav 容器與連結的 fallback。
   用 :where() specificity=0——有載 style.css 的頁一律以 style.css 為準、不受影響；
   只有「完全沒有 nav 容器規則」的頁才吃這份。值與 style.css 的 Navigation 區段同步。
   article 頁的 .art-hero{padding-top:48px} 正好補償這裡的 fixed nav 48px 高度。 */
:where(nav){position:fixed;top:0;left:0;right:0;z-index:200;height:48px;background:rgba(255,255,255,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid rgba(0,0,0,0.1);display:flex;align-items:center;justify-content:space-between;padding:0 2rem}
:where(.nav-logo){font-size:15px;font-weight:500;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;color:#1d1d1f}
:where(.nav-links){display:flex;gap:1.75rem}
:where(.nav-links a){font-size:12px;color:#1d1d1f;opacity:.8;text-decoration:none}
:where(.nav-links a:hover){opacity:1}
:where(.nav-links a.active){opacity:1;font-weight:600;color:var(--red,#C61B1C)}
:where(.nav-cta){font-size:12px;font-weight:500;background:#1d1d1f;color:#fff;padding:6px 16px;border-radius:20px;text-decoration:none}
@media(max-width:768px){
  :where(nav){padding:0 1rem}
  :where(.nav-links){display:none}
}
</style>

  <div class="nav-center">

  <button type="button" class="cx-burger" aria-label="開啟選單" aria-expanded="false" data-cx-burger>

</nav>
<div class="cx-mobile-menu" data-cx-mobile-menu aria-hidden="true">
  <a href="/" data-page="index">首頁</a>
  <a href="services.html" data-page="services">服務項目</a>
  <a href="tools.html" data-page="tools">小工具</a>

</div>
<script>
(function(){
  function closeMenu(){
    var menu = document.querySelector('[data-cx-mobile-menu]');
    if (menu) { menu.classList.remove('cx-open'); menu.setAttribute('aria-hidden','true'); }
    var b = document.querySelector('[data-cx-burger]');
    if (b) b.setAttribute('aria-expanded','false');
    document.body.classList.remove('cx-menu-open');
    document.body.style.top = '';
    if (window.__cxScrollY != null) { window.scrollTo(0, window.__cxScrollY); window.__cxScrollY = null; }
  }
  document.addEventListener('click', function(e){
    var burger = e.target.closest('[data-cx-burger]');
    var menu = document.querySelector('[data-cx-mobile-menu]');
    if (!menu) return;
    if (burger) {
      var open = !menu.classList.contains('cx-open');
      menu.classList.toggle('cx-open', open);
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      menu.setAttribute('aria-hidden', open ? 'false' : 'true');
      if (open) {
        // 記住當下位置：position:fixed 鎖版會讓 body 脫離文件流
        var navEl = document.querySelector('nav');
        if (navEl) {
          // 全站 nav 有 48/49/60px 三種高度，寫死會露縫或蓋住 nav，量測後才定位
          document.documentElement.style.setProperty(
            '--cx-nav-h', Math.round(navEl.getBoundingClientRect().height) + 'px');
        }
        window.__cxScrollY = window.scrollY || document.documentElement.scrollTop || 0;
        document.body.style.top = '-' + window.__cxScrollY + 'px';
        document.body.classList.add('cx-menu-open');
      } else {
        closeMenu();
      }
      return;
    }
    var inLink = e.target.closest('[data-cx-mobile-menu] a');
    if (inLink) {
      closeMenu();
    }
  });
})();
</script>
