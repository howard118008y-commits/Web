<meta name="robots" content="noindex">
<style>
.afm-overlay{position:fixed;inset:0;background:rgba(15,15,20,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;animation:afmFadeIn .25s ease}
.afm-overlay.afm-show{display:flex}
@keyframes afmFadeIn{from{opacity:0}to{opacity:1}}
.afm-card{background:#fff;border-radius:20px;max-width:540px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:afmSlideUp .3s ease}
@keyframes afmSlideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.afm-head{padding:28px 28px 18px;border-bottom:1px solid #f0f0f3;text-align:center}
.afm-icon{font-size:42px;line-height:1;margin-bottom:10px}
.afm-title{font-size:22px;font-weight:800;color:#1d1d1f;letter-spacing:.02em;margin:0 0 4px}
.afm-sub{font-size:13px;color:#86868b;margin:0;letter-spacing:.06em}
.afm-body{padding:22px 28px}
.afm-lead{font-size:14px;color:#1d1d1f;line-height:1.65;margin:0 0 16px}
.afm-lead strong{color:#c00;font-weight:700}
.afm-list{list-style:none;padding:0;margin:0 0 18px}
.afm-list li{display:flex;align-items:flex-start;gap:10px;padding:9px 0;font-size:14px;color:#1d1d1f;line-height:1.5;border-bottom:1px dashed #f0f0f3}
.afm-list li:last-child{border-bottom:0}
.afm-x{flex:0 0 auto;color:#dc2626;font-weight:800;font-size:16px;line-height:1.4}
.afm-contact{background:#f5f5f7;border-radius:12px;padding:16px 18px;margin-top:10px}
.afm-contact-label{font-size:12px;font-weight:700;color:#0F7A4F;letter-spacing:.1em;margin:0 0 8px}
.afm-contact-row{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0;font-size:14px;color:#1d1d1f;line-height:1.6}
.afm-contact-row strong{color:#1d1d1f;font-weight:700}
.afm-contact-row a{color:#1d1d1f;text-decoration:none;font-weight:700}
.afm-foot{padding:18px 28px 24px;border-top:1px solid #f0f0f3;background:#fafafa;border-radius:0 0 20px 20px}
.afm-check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:14px;color:#1d1d1f;line-height:1.5;margin-bottom:14px;user-select:none}
.afm-check input{flex:0 0 auto;margin-top:3px;width:18px;height:18px;cursor:pointer;accent-color:#0071e3}
.afm-check span{flex:1}
.afm-btn{display:block;width:100%;background:#0071e3;color:#fff;font-size:16px;font-weight:700;padding:14px 24px;border:0;border-radius:12px;cursor:pointer;transition:background .2s,opacity .2s;letter-spacing:.04em;font-family:inherit}
.afm-btn:hover:not(:disabled){background:#0058b8}
.afm-btn:disabled{background:#c7c7cc;cursor:not-allowed;opacity:.7}
.afm-warn{font-size:12px;color:#86868b;text-align:center;margin:10px 0 0;line-height:1.5}
.afm-warn strong{color:#c00}
@media(max-width:480px){
  .afm-overlay{padding:12px}
  .afm-card{border-radius:16px;max-height:94vh}
  .afm-head{padding:22px 20px 14px}
  .afm-icon{font-size:36px}
  .afm-title{font-size:19px}
  .afm-body{padding:18px 20px}
  .afm-lead{font-size:13px}
  .afm-list li{font-size:13px;padding:8px 0}
  .afm-contact{padding:14px}
  .afm-contact-row{font-size:13px}
  .afm-foot{padding:14px 20px 18px}
  .afm-check{font-size:13px}
  .afm-btn{font-size:15px;padding:13px 20px}
}
body.afm-lock{overflow:hidden}
/* 廣告點擊改用頂端細條（不擋內容），自然流量維持全屏聲明 */
.afm-bar{display:flex;align-items:center;gap:10px;background:#fff8e6;border-bottom:1px solid #f0e2b6;color:#6b5b1e;font-size:12.5px;line-height:1.4;padding:8px 12px;position:relative;z-index:998}
.afm-bar-text{flex:1;min-width:0}
.afm-bar-view{flex:0 0 auto;background:none;border:1px solid #c9a94e;color:#8a6d1a;font-size:12px;font-weight:700;border-radius:14px;padding:4px 10px;cursor:pointer;font-family:inherit;white-space:nowrap}
.afm-bar-close{flex:0 0 auto;background:none;border:0;color:#a08c4a;font-size:14px;cursor:pointer;padding:4px 6px;line-height:1}
</style>

<div class="afm-overlay" id="afmOverlay" role="dialog" aria-modal="true" aria-labelledby="afmTitle">
  <div class="afm-card">
    <div class="afm-head">
      <div class="afm-icon">🛡️</div>
      <h2 class="afm-title" id="afmTitle">重要聲明 ・ 慎防詐騙</h2>
      <p class="afm-sub">ANTI-FRAUD NOTICE</p>
    </div>
    <div class="afm-body">
      <p class="afm-lead">近期詐騙案件頻傳，<strong>鋮馨租賃絕不會</strong>做以下行為。如遇有人冒名要求，請立即停止並撥打 <strong>165 反詐騙專線</strong>：</p>
      <ul class="afm-list">
        <li><span class="afm-x">✕</span><span>要求預付任何費用（代辦費、保證金、手續費）</span></li>
        <li><span class="afm-x">✕</span><span>索取網銀密碼、OTP 簡訊驗證碼或提款卡</span></li>
        <li><span class="afm-x">✕</span><span>要求加非官方 LINE 或安裝任何 APP</span></li>
        <li><span class="afm-x">✕</span><span>透過第三方帳戶代收款項</span></li>
      </ul>
      <div class="afm-contact">
        <p class="afm-contact-label">✓ 唯一官方聯絡管道</p>
        <div class="afm-contact-row">☎ <a href="tel:+886-2-2249-0517">02-2249-0517</a> ／ <a href="tel:+886-931-087-996">0931-087-996</a></div>
        <div class="afm-contact-row">💬 LINE：<strong>@lin.ee/PHIfSoY</strong></div>
        <div class="afm-contact-row">📍 新北市中和區中正路 468 號</div>
      </div>
    </div>
    <div class="afm-foot">
      <label class="afm-check">
        <input type="checkbox" id="afmCheck">
        <span>我已詳閱並了解上述反詐騙聲明</span>
      </label>
      <button type="button" class="afm-btn" id="afmBtn" disabled>我已了解，進入網站</button>
      <p class="afm-warn">如曾遭受詐騙，請立即撥打 <strong>165</strong> 反詐騙專線</p>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY = 'cx_antifraud_v1';
  var AD_SESSION = 'cx_afm_adsession';
  var DAYS = 7;
  var now = Date.now();
  try {
    var saved = parseInt(localStorage.getItem(KEY), 10);
    if (saved && (now - saved) < DAYS*86400000) return;
  } catch(e) {}

  var overlay = document.getElementById('afmOverlay');
  var check = document.getElementById('afmCheck');
  var btn = document.getElementById('afmBtn');
  if (!overlay || !check || !btn) return;

  function markSeen(){
    try { localStorage.setItem(KEY, String(Date.now())); } catch(e) {}
  }
  function closeOverlay(){
    overlay.classList.remove('afm-show');
    document.body.classList.remove('afm-lock');
  }
  function removeBar(){
    var bar = document.getElementById('afmBar');
    if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
    var nav = document.querySelector('nav');
    if (nav && nav.style.top) nav.style.top = '';
  }

  check.addEventListener('change', function(){
    btn.disabled = !check.checked;
  });

  btn.addEventListener('click', function(){
    if (!check.checked) return;
    markSeen();
    closeOverlay();
    removeBar();
    if (typeof gtag === 'function') {
      gtag('event', 'antifraud_consent', { page_path: location.pathname });
    }
  });

  // 廣告點擊（gclid/fbclid 等或 utm_medium=paid）：不擋全屏，改頂端細條；同一造訪的後續頁面也維持細條
  var urlAd = /(?:[?&](?:gclid|fbclid|msclkid|wbraid|gbraid|ttclid)=)|utm_medium=(?:paid|cpc|ppc|paid_social)/i.test(location.search);
  if (urlAd) { try { sessionStorage.setItem(AD_SESSION, '1'); } catch(e) {} }
  var isAd = urlAd;
  try { isAd = isAd || sessionStorage.getItem(AD_SESSION) === '1'; } catch(e) {}

  if (isAd) {
    var bar = document.createElement('div');
    bar.id = 'afmBar';
    bar.className = 'afm-bar';
    bar.innerHTML = '<span class="afm-bar-text">🛡️ 慎防詐騙：鋮馨租賃絕不要求預付任何費用、絕不索取網銀密碼</span>'
      + '<button type="button" class="afm-bar-view" id="afmBarView">查看聲明</button>'
      + '<button type="button" class="afm-bar-close" id="afmBarClose" aria-label="關閉">✕</button>';
    document.body.insertBefore(bar, document.body.firstChild);
    // 全站 nav 為 fixed 頂部懸浮：細條改懸浮最頂、nav 往下讓位（關閉細條即復原）
    var navEl = document.querySelector('nav');
    if (navEl && getComputedStyle(navEl).position === 'fixed') {
      bar.style.position = 'fixed';
      bar.style.top = '0';
      bar.style.left = '0';
      bar.style.right = '0';
      bar.style.zIndex = '9998';
      navEl.style.top = bar.offsetHeight + 'px';
    }
    document.getElementById('afmBarView').addEventListener('click', function(){
      overlay.classList.add('afm-show');
      document.body.classList.add('afm-lock');
    });
    document.getElementById('afmBarClose').addEventListener('click', function(){
      markSeen();
      removeBar();
    });
    // 從細條打開的聲明，點背景可關回（不強制勾選）
    overlay.addEventListener('click', function(e){
      if (e.target === overlay) closeOverlay();
    });
    return;
  }

  overlay.classList.add('afm-show');
  document.body.classList.add('afm-lock');
})();
</script>
