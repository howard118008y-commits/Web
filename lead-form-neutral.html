<!-- 共用元件：衛教頁中性詢問表單。用 <div data-include="lead-form-neutral"></div> 載入。
     本檔為 lead-form.html 的衛教頁中性變體，結構與腳本與站台級同步維護；站台級改結構／腳本時本檔必須同步，僅文案五處＋hidden 欄位維持差異。
     （媽祖 2026-08-12 裁示⑧⑨⑩；適用判準＝表單跟著 CTA 帽走，中性橋接帽頁面配本檔。）
     欄位名用英文 ASCII（Web3Forms 對中文欄位名會編碼亂碼）。 -->
<style>
.form-wrap{background:#f5f5f7;max-width:none;margin:0;padding:80px 24px}
.form-inner{max-width:640px;margin:0 auto}
.form-wrap .section-label{font-size:12px;color:#c8102e;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:12px;text-align:center}
.form-wrap .section-title{font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.1;color:#1d1d1f;margin-bottom:40px;text-align:center}
.form-card{background:#fff;border:.5px solid #d2d2d7;border-radius:24px;padding:40px 32px;box-shadow:0 4px 24px rgba(0,0,0,.04)}
.form-privacy{display:flex;gap:12px;align-items:flex-start;background:#f0faf3;border:1px solid rgba(6,199,85,.25);border-radius:14px;padding:16px 18px;margin-bottom:28px}
.form-privacy .lock{font-size:20px;line-height:1.4;flex-shrink:0}
.form-privacy p{font-size:13px;color:#1d1d1f;line-height:1.65;margin:0}
.form-privacy a{color:#0F7A4F;font-weight:600}
.field{margin-bottom:20px}
.field label{display:block;font-size:14px;font-weight:600;color:#1d1d1f;margin-bottom:8px}
.field label .opt{font-weight:400;color:#86868b;font-size:12px}
.field label .req{color:#c8102e;margin-left:2px}
.field input,.field select,.field textarea{width:100%;font-size:16px;color:#1d1d1f;background:#f5f5f7;border:1px solid transparent;border-radius:12px;padding:14px 16px;box-sizing:border-box;font-family:inherit;transition:border-color .15s,background .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#048456;background:#fff}
/* 鍵盤／輔具焦點指示（滑鼠點擊不觸發）— WCAG 2.4.7 */
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible,
.consent input:focus-visible,.form-submit:focus-visible{outline:2px solid #1D1D1F;outline-offset:2px}
.field textarea{resize:vertical;min-height:96px}
.consent{display:flex;gap:10px;align-items:flex-start;margin:8px 0 24px}
.consent input{width:24px;height:24px;margin-top:0;flex-shrink:0;accent-color:#048456;cursor:pointer}
.consent label{font-size:13px;color:#6e6e73;line-height:1.6;cursor:pointer;padding:3px 0}
.consent a{color:#0F7A4F;font-weight:600}
.form-submit{width:100%;background:#048456;color:#fff;font-size:16px;font-weight:700;border:none;border-radius:14px;padding:16px;cursor:pointer;letter-spacing:.01em;transition:opacity .15s}
.form-submit:hover{opacity:.9}
.form-submit:disabled{opacity:.5;cursor:not-allowed}
.form-foot{font-size:12px;color:#86868b;text-align:center;margin-top:16px;line-height:1.6}
.form-msg{display:none;border-radius:14px;padding:18px 20px;font-size:14px;line-height:1.65}
.form-msg.ok{display:block;background:#f0faf3;color:#157347;border:1px solid rgba(6,199,85,.3)}
.form-msg.ok a,.form-msg.err a{color:#0F7A4F;font-weight:600}
.form-msg.err{display:block;background:#fdf0f1;color:#c8102e;border:1px solid rgba(200,16,46,.3);margin-top:18px}
.hp{position:absolute!important;left:-9999px!important;opacity:0}

/* === 浮動標籤輸入（改自 Uiverse AbanoubMagdy1 / afraid-yak-99，MIT，focus 色改品牌紅） ===
   標籤逐字上浮，省掉獨立 label 行高。判斷用 :not(:placeholder-shown) 而非 :valid——
   :valid 對「選填且留空」的欄位為真，標籤會沒填就自己浮上去。故每個 input 都帶 placeholder=" "。 */
.wave-group{position:relative;margin-bottom:30px}
.wave-group .input{font-size:16px;padding:10px 4px 10px 2px;display:block;width:100%;border:none;border-bottom:1px solid #d2d2d7;background:transparent;font-family:inherit;color:#1d1d1f;border-radius:0}
.wave-group .input:focus{outline:none}
.wave-group .input:focus-visible{outline:2px solid #1D1D1F;outline-offset:2px}
.wave-group .label{color:#86868b;font-size:16px;font-weight:400;position:absolute;pointer-events:none;left:2px;top:12px;display:flex}
.wave-group .label-char{transition:.2s ease all;transition-delay:calc(var(--index)*.04s)}
.wave-group .input:focus~label .label-char,
.wave-group .input:not(:placeholder-shown)~label .label-char{transform:translateY(-22px);font-size:12.5px;color:#C61B1C}
.wave-group .bar{position:relative;display:block;width:100%}
.wave-group .bar:before,.wave-group .bar:after{content:'';height:2px;width:0;bottom:0;position:absolute;background:#C61B1C;transition:.2s ease all}
.wave-group .bar:before{left:50%}
.wave-group .bar:after{right:50%}
.wave-group .input:focus~.bar:before,.wave-group .input:focus~.bar:after{width:50%}
.wave-group .req{color:#c8102e;margin-left:2px}
.wave-group .opt{color:#86868b;font-size:12px;margin-left:4px}

/* === 服務選項卡（改自 Uiverse Yaya12085 / silent-liger-85，MIT，選中色改品牌紅） === */
.svc-label{display:block;font-size:14px;font-weight:600;color:#1d1d1f;margin-bottom:10px}
.svc-label .req{color:#c8102e;margin-left:2px}
.svc-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;user-select:none}
/* 選擇器要比 `.field input{width:100%}` 強，否則隱藏 radio 被撐成滿版寬、整頁橫向溢出 */
.svc-tiles .svc-input{clip:rect(0 0 0 0);clip-path:inset(100%);height:1px;overflow:hidden;position:absolute;white-space:nowrap;width:1px;padding:0;margin:0;border:0;background:transparent}
.svc-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:104px;padding:14px 8px;border-radius:14px;border:1.5px solid #d2d2d7;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:.15s ease;cursor:pointer;position:relative;height:100%}
.svc-tile:before{content:"";position:absolute;width:.75rem;height:.75rem;border:2px solid #d2d2d7;background:#fff;border-radius:50%;top:.5rem;right:.5rem;opacity:0;transform:scale(0);transition:.25s ease}
.svc-tile:hover{border-color:#C61B1C}
.svc-tile:hover:before{transform:scale(1);opacity:1}
.svc-input:checked+.svc-tile{border-color:#C61B1C;box-shadow:0 6px 18px rgba(198,27,28,.14)}
.svc-input:checked+.svc-tile:before{transform:scale(1);opacity:1;background:#C61B1C;border-color:#C61B1C}
.svc-input:checked+.svc-tile .svc-icon svg{fill:#C61B1C}
.svc-input:checked+.svc-tile .svc-name{color:#C61B1C;font-weight:700}
.svc-input:checked+.svc-tile .svc-sub{color:rgba(198,27,28,.7)}
.svc-input:focus-visible+.svc-tile{outline:2px solid #1D1D1F;outline-offset:2px}
.svc-icon svg{width:24px;height:24px;fill:#5a5a5f}
.svc-name{display:block;color:#6e6e73;font-size:14px;font-weight:600;transition:.3s ease;text-align:center;line-height:1.35}
.svc-sub{display:block;margin-top:3px;font-size:11.5px;color:#86868b;font-weight:400}

@media(max-width:768px){
  .form-wrap{padding:56px 16px}
  .form-card{padding:28px 20px}
  .form-wrap .section-title{font-size:26px}
  /* 六張卡在窄寬度改直排＋橫向排版，否則卡片過窄字會擠成兩行 */
  .svc-tiles{grid-template-columns:1fr;gap:8px}
  .svc-tile{flex-direction:row;justify-content:flex-start;gap:12px;min-height:0;padding:14px 16px}
  .svc-name{text-align:left}
}
</style>

<script>
(function(){
  var form=document.getElementById('evalForm');
  if(!form)return;
  var btn=document.getElementById('submitBtn');
  var msg=document.getElementById('formMsg');
  var consent=document.getElementById('consent');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    msg.className='form-msg';msg.innerHTML='';
    if(!form.checkValidity()||!consent.checked){
      msg.className='form-msg err';
      msg.innerHTML=consent.checked?'請填寫必填欄位（標示 * 者）。':'請先勾選同意隱私權政策。';
      return;
    }
    var orig=btn.textContent;btn.disabled=true;btn.textContent='送出中…';
    // 同步通知自家後端推 LINE 給工作機（best-effort，失敗不影響主流程）
    try{fetch('https://cx468-linebot.onrender.com/lead',{method:'POST',body:new FormData(form)}).catch(function(){});}catch(e){}
    fetch('https://api.web3forms.com/submit',{
      method:'POST',headers:{'Accept':'application/json'},body:new FormData(form)
    })
    .then(function(r){return r.json();})
    .then(function(j){
      if(j.success){
        form.style.display='none';
        msg.className='form-msg ok';
        msg.innerHTML='✅ 已收到你的資料，謝謝！專人將於 1–2 個工作日內與你聯繫。<br>急件可直接加 LINE：<a href="https://lin.ee/PHIfSoY">@0931087996</a>';
        if(window.gtag)gtag('event','generate_lead',{page_path:location.pathname,form:'inquiry'});
        if(window.fbq)fbq('track','Lead');
      }else{throw new Error(j.message||'送出失敗');}
    })
    .catch(function(){
      btn.disabled=false;btn.textContent=orig;
      msg.className='form-msg err';
      msg.innerHTML='送出失敗，請稍後再試，或直接加 LINE 與我們聯繫：<a href="https://lin.ee/PHIfSoY">@0931087996</a>';
    });
  });
})();
</script>
