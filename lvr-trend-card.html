<!-- 互動趨勢卡（Uiverse 3D Graph 機制 → 鋮馨品牌化）
     由 lvr-observatory.html 以 data-include 注入；資料讀 lvr-data/city_trend.json。
     原版是深色霓虹科技風；本站 observatory 是白底編輯風，故：
       - 卡面沿用深色（資料圖表在深底可讀性最好，也做出視覺焦點）
       - 霓虹橘紅 conic-gradient 換成品牌紅 #C61B1C / 深紅 #8A1416
       - 保留 3D 傾斜（5×3 感應區）、掃光、折線 draw-in 動畫 -->
<style>
.tc-wrap{position:relative;padding:2.5rem 0;display:flex;justify-content:center;max-width:100%}
.tc-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);z-index:1}
.tc-area{position:relative;z-index:1}
.tc-card-wrap{position:relative;z-index:9;border-radius:28px;display:flex;max-width:100%}
.tc-card-wrap::before{content:"";position:absolute;inset:8px;border-radius:36px;background:rgba(0,0,0,.35);
  box-shadow:0 40px 90px 18px rgba(0,0,0,.42),0 -30px 70px rgba(198,27,28,.10);filter:blur(5px)}
.tc-glow,.tc-glow-out{position:absolute;overflow:hidden;border-radius:inherit;filter:brightness(1.35);pointer-events:none}
.tc-glow::before,.tc-glow-out::before{content:"";position:absolute;top:50%;left:50%;width:180%;height:180%;
  transform:translate(-50%,-50%) rotate(45deg);transition:transform 1.5s ease}
.tc-glow::before{z-index:-2;background:conic-gradient(#C61B1C 0%,transparent 20%,#8A1416 50%,#0a0a0c 60%,transparent 80%,#C61B1C 100%)}
.tc-glow-out::before{background:conic-gradient(#C61B1C 0%,transparent 10%,transparent 35%,#e05a5b 50%,transparent 60%,transparent 90%,#C61B1C 100%)}
/* 光暈壓低：初版 .42/.4 會在卡面中央燒出紅光斑，蓋住折線讀不出數值 */
.tc-glow{filter:blur(22px);inset:5px;opacity:.18;z-index:0}
.tc-glow-out{inset:-1px;z-index:1;opacity:.32}
.tc-card-wrap:hover .tc-glow::before,.tc-card-wrap:hover .tc-glow-out::before{transform:translate(-50%,-50%) rotate(410deg)}
.tc-card{padding:7px;border-radius:inherit;transform-style:preserve-3d;will-change:transform;
  transition:2s cubic-bezier(.03,1,.5,1)}
.tc-card-bg{position:absolute;inset:0;border-radius:inherit;z-index:2;
  background:linear-gradient(to bottom,#1b1b20 40%,#0a0a0c 100%);
  box-shadow:0 15px 20px rgba(0,0,0,.6),inset 0 0 3px rgba(255,255,255,.1),inset 0 29px 5px -31px #fff}
.tc-content{position:relative;z-index:3;padding:22px 26px 4px;border-radius:22px;transform:translateZ(10px);
  transform-style:preserve-3d;transition:2s cubic-bezier(.03,1,.5,1);
  background:linear-gradient(to bottom,#1e1e25 40%,#33333f 100%);
  box-shadow:inset 0 0 2px rgba(255,255,255,.1),inset 0 0 70px #2a2a34,
    inset 40px 70px 30px -20px rgba(0,0,0,.3),inset 0 30px 5px -30px rgba(255,255,255,.65),inset 0 -3px 2px -2px #fff}
.tc-head{position:relative;transform:translateZ(30px);transform-style:preserve-3d;color:rgba(255,255,255,.6);margin-bottom:6px}
.tc-title{font-size:11.5px;letter-spacing:.14em}
.tc-value{font-size:21px;font-weight:700;color:#fff;display:flex;align-items:baseline;gap:6px;margin-top:2px;
  font-family:"Noto Serif TC","Songti TC",serif}
.tc-value em{font-style:normal;font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.06em}
.tc-badge{position:absolute;right:0;top:2px;display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  font-size:10.5px;font-weight:600;letter-spacing:.06em;color:#fff;background:rgba(198,27,28,.9);
  box-shadow:0 0 1px 2px rgba(198,27,28,.45),0 3px 3px 2px rgba(224,90,91,.35)}
.tc-chart{width:min(560px,72vw)}
.tc-chart svg{display:block;width:100%;overflow:visible}
.tc-chart .tc-gl{stroke:rgba(255,255,255,.13);stroke-width:1}
.tc-path{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:900;stroke-dashoffset:900;animation:tc-draw 2.4s cubic-bezier(.22,.61,.36,1) .3s forwards}
.tc-dot{opacity:0;animation:tc-pop .4s ease forwards}
.tc-foot{display:flex;transform:translateZ(30px);transform-style:preserve-3d;margin:2px -6px 0;font-size:9.5px}
.tc-foot span{flex:1;text-align:center;padding:10px 0;color:rgba(255,255,255,.5);letter-spacing:.02em}
.tc-legend{display:flex;gap:14px;justify-content:center;padding:0 0 16px;transform:translateZ(24px);
  transform-style:preserve-3d;font-size:10.5px;color:rgba(255,255,255,.62);flex-wrap:wrap}
.tc-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tc-glare{position:absolute;overflow:hidden;border-radius:inherit;filter:blur(10px);inset:5px;opacity:.5;pointer-events:none;z-index:4}
.tc-glare::before{content:"";position:absolute;top:50%;left:50%;width:110px;height:110px;border-radius:50%;
  background:#fff;filter:blur(60px);transform:translate(-50%,-50%);opacity:0;
  transition:2s cubic-bezier(.03,1,.5,1)}
@keyframes tc-draw{to{stroke-dashoffset:0}}
@keyframes tc-pop{to{opacity:1}}
@media(prefers-reduced-motion:reduce){
  .tc-path{animation:none;stroke-dashoffset:0}
  .tc-dot{animation:none;opacity:1}
  .tc-card,.tc-content,.tc-glare::before{transition:none}
}
@media(max-width:768px){
  .tc-grid{display:none}                 /* 觸控無 hover，關閉感應區 */
  .tc-wrap{padding:1.5rem 0}
  .tc-card-wrap{width:100%}
  .tc-card{width:100%;padding:5px}
  .tc-content{padding:18px 14px 4px}
  /* 用 100% 跟隨父容器，不可用 vw——vw 不扣父層 padding，會讓卡片撐破 .chart-card 邊框 */
  .tc-chart{width:100%}
  .tc-foot span{font-size:8.5px}
  .tc-legend{gap:10px;font-size:9.5px}
}
</style>

<div class="tc-wrap" id="tcWrap">
  <div class="tc-grid" aria-hidden="true">
    <div class="tc-area"></div><div class="tc-area"></div><div class="tc-area"></div><div class="tc-area"></div><div class="tc-area"></div>
    <div class="tc-area"></div><div class="tc-area"></div><div class="tc-area"></div><div class="tc-area"></div><div class="tc-area"></div>
    <div class="tc-area"></div><div class="tc-area"></div><div class="tc-area"></div><div class="tc-area"></div><div class="tc-area"></div>
  </div>
  <div class="tc-card-wrap">
    <div class="tc-glow" aria-hidden="true"></div>
    <div class="tc-glow-out" aria-hidden="true"></div>
    <div class="tc-card" id="tcCard">
      <div class="tc-card-bg" aria-hidden="true"></div>
      <div class="tc-content">
        <div class="tc-head">
          <div class="tc-title">四縣市・單價中位數跨季趨勢</div>
          <div class="tc-value" id="tcLatest">—<em>萬/坪</em></div>
          <div class="tc-badge" id="tcSpan">—</div>
        </div>
        <div class="tc-chart"><svg id="tcSvg" viewBox="0 0 560 190" preserveAspectRatio="none" role="img"
             aria-label="台北、新北、台中、桃園四縣市單價中位數跨季趨勢折線圖"></svg></div>
        <div class="tc-foot" id="tcFoot"></div>
        <div class="tc-legend" id="tcLegend"></div>
      </div>
      <div class="tc-glare" aria-hidden="true"></div>
    </div>
  </div>
</div>

<script>
(function () {
  // 資料視覺化配色：可區分性優先於品牌單一色。
  // 初版四色有兩條紅（台北 #e05a5b / 新北 #C61B1C）在深底幾乎分不出來，已改為四個色相。
  var COLORS = { '台北市': '#C61B1C', '新北市': '#e8b53f', '台中市': '#2fa4a0', '桃園市': '#9aa7c4' };
  var svg = document.getElementById('tcSvg');
  if (!svg) return;

  fetch('lvr-data/city_trend.json').then(function (r) { return r.json(); }).then(function (d) {
    var seasons = d.seasons || [], series = d.series || {};
    var cities = Object.keys(series);
    if (!seasons.length || !cities.length) return;

    var W = 560, H = 190, PADT = 14, PADB = 10;
    var all = [];
    cities.forEach(function (c) { series[c].forEach(function (v) { if (v != null) all.push(v); }); });
    var min = Math.min.apply(null, all), max = Math.max.apply(null, all);
    var range = (max - min) || 1;
    var x = function (i) { return seasons.length > 1 ? (i / (seasons.length - 1)) * W : W / 2; };
    var y = function (v) { return PADT + (1 - (v - min) / range) * (H - PADT - PADB); };

    var svgNS = 'http://www.w3.org/2000/svg', parts = '';
    [0.25, 0.5, 0.75].forEach(function (p) {
      var gy = PADT + p * (H - PADT - PADB);
      parts += '<line class="tc-gl" x1="0" y1="' + gy.toFixed(1) + '" x2="' + W + '" y2="' + gy.toFixed(1) + '"/>';
    });
    cities.forEach(function (c, ci) {
      var pts = [];
      series[c].forEach(function (v, i) { if (v != null) pts.push([x(i), y(v)]); });
      if (!pts.length) return;
      var dAttr = pts.map(function (p, i) {
        return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
      }).join(' ');
      parts += '<path class="tc-path" d="' + dAttr + '" stroke="' + (COLORS[c] || '#888') +
               '" style="animation-delay:' + (0.3 + ci * 0.18).toFixed(2) + 's"/>';
      var last = pts[pts.length - 1];
      parts += '<circle class="tc-dot" cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) +
               '" r="3.5" fill="' + (COLORS[c] || '#888') + '" style="animation-delay:' + (2.2 + ci * 0.18).toFixed(2) + 's"/>';
    });
    svg.innerHTML = parts;

    // 只標首、中、末三個季別，避免手機擠成一團
    var foot = document.getElementById('tcFoot');
    if (foot) {
      var picks = [0, Math.floor((seasons.length - 1) / 2), seasons.length - 1];
      foot.innerHTML = picks.map(function (i) { return '<span>' + seasons[i] + '</span>'; }).join('');
    }
    var legend = document.getElementById('tcLegend');
    if (legend) {
      legend.innerHTML = cities.map(function (c) {
        return '<span><i style="background:' + (COLORS[c] || '#888') + '"></i>' + c + '</span>';
      }).join('');
    }
    var span = document.getElementById('tcSpan');
    if (span) span.textContent = seasons[0] + ' → ' + seasons[seasons.length - 1];
    var latest = document.getElementById('tcLatest');
    if (latest && series['台北市']) {
      var arr = series['台北市'].filter(function (v) { return v != null; });
      if (arr.length) latest.innerHTML = '台北 ' + arr[arr.length - 1] + '<em>萬/坪</em>';
    }
  }).catch(function () { /* 資料未就緒時保持靜態外觀，不報錯 */ });

  // 3D 傾斜：5×3 感應區決定角度（沿用 Uiverse 機制，改用 JS 綁定較好維護）
  var wrap = document.getElementById('tcWrap'), card = document.getElementById('tcCard');
  var glare = wrap && wrap.querySelector('.tc-glare::before') ? null : (wrap && wrap.querySelector('.tc-glare'));
  if (!wrap || !card || window.matchMedia('(hover:none)').matches) return;
  var areas = wrap.querySelectorAll('.tc-area');
  areas.forEach(function (a, idx) {
    var row = Math.floor(idx / 5), col = idx % 5;
    var rx = [-13, 0, 13][row];              // 上排前傾、中排平、下排後傾
    var ry = [15, 7, 0, -7, -15][col];
    a.addEventListener('mouseenter', function () {
      card.style.transform = 'perspective(800px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    });
  });
  wrap.addEventListener('mouseleave', function () { card.style.transform = ''; });
})();
</script>
